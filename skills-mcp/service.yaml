apiVersion: v1
kind: Service
metadata:
  name: skills-mcp
  namespace: skills
  labels:
    app: skills-mcp
spec:
  type: ClusterIP
  selector:
    app: skills-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skills-mcp
  namespace: skills
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: skills-mcp.v2.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skills-mcp
                port:
                  number: 80
