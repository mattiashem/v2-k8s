    # k8s-v2-ops — Local Cluster Health & Repair

    You are operating on the **local k8s cluster** (kubeconfig: `~/.kube/config`, NOT `~/.kube/confighrb` which is the HRB mail cluster).

    ## What to do

    1. **Audit** — get all unhealthy pods cluster-wide, categorise by status
    2. **Check PVC usage** — full volumes cause silent app failures (JS errors, write failures, crashes)
    3. **Fix** — resolve issues in priority order (see below)
    4. **Report** — summarise what was fixed, what needs manual intervention, and what is a known pre-existing issue

    ## Repair Priority Order

    Work through tiers top-to-bottom. Do not restart app-tier services while storage or databases are still unhealthy.

    ### Tier 1 — Cluster Infrastructure
    | Service | Namespace | How to check |
    |---------|-----------|--------------|
    | Longhorn | `longhorn-system` | CSI pods, instance-managers, node/disk health |
    | Democratic CSI (NFS) | `democratic-csi` | `zfs-nfs-democratic-csi-controller` — connects to TrueNAS at `http://10.0.0.10:80` |
    | Democratic CSI (iSCSI) | `democratic-csi` | `zfs-iscsi-democratic-csi-controller` |
    | Traefik ingress | `traefik` | deployment `traefik` — check for Completed pods, clean them up |
    | cert-manager | `cert-manager` | deployments + any stuck `CertificateRequest`/`Challenge` |

    ### Tier 2 — Databases & Message Queues
    | Service | Namespace | Notes |
    |---------|-----------|-------|
    | MariaDB | `home` | StatefulSet `mariadb` |
    | MySQL | `home` | StatefulSet `mysql` |
    | mysql-operator | `sql` | StatefulSet `mysql-operator` |
    | NATS | `code` | StatefulSet `nats` (3 replicas) — PVCs use Longhorn |
    | NATS | `samma` | StatefulSet `nats` |
    | TimescaleDB | `samma` | StatefulSet `samma-infra-timescaledb` |
    | CloudNativePG clusters | various | `kubectl get cluster -A` |

    ### Tier 3 — Platform Services
    | Service | Namespace |
    |---------|-----------|
    | Wazuh (indexer, dashboard, manager) | `wazuh` |
    | ArgoCD | `argocd` |
    | Vector logging | `logging` |
    | ARC runners | `arc-systems` |
    | OpenClaw / OpenClaw-Zoe | `openclaw`, `openclaw-zoe` |

    ### Tier 4 — Applications
    | Service | Namespace |
    |---------|-----------|
    | Home Assistant | `home` — PVC `homeassistant-longhorn`, watch for DB growth |
    | Pihole | `home` |
    | Plex | `plex` |
    | N8N (hrb + valus) | `home` |
    | Overseerr, Prowlarr, Radarr | `home` |
    | Photoprism | `home` |
    | Ollama + Open WebUI | `home` |
    | RKLLama | `home` |
    | Code namespace apps | `code` |
    | Samma API | `samma-io` |

    ## PVC Health Check

    Always check PVC usage — a full volume causes silent failures (apps crash, write errors, JS load failures) rather than obvious pod errors.

    ```bash
    # Check all PVC usage across the cluster
    kubectl get pods -A --no-headers | grep Running | awk '{print $1, $2}' | while read ns pod; do
      kubectl exec -n $ns $pod -- df -h 2>/dev/null | grep -v "Filesystem\|tmpfs\|overlay\|shm" | awk -v ns=$ns -v pod=$pod '$5+0 > 70 {print ns"/"pod, $1, $5, $6}'
    done 2>/dev/null
    ```

    ### Home Assistant — known disk issues
    HA accumulates a large SQLite recorder DB (`home-assistant_v2.db`) and can leave behind corrupt DB backups (`.db.corrupt.*`) that are several GB each.

    ```bash
    # Check HA disk usage
    kubectl exec -n home $(kubectl get pod -n home -l app=homeassistant --no-headers | awk '{print $1}') -- du -sh /config/* | sort -rh | head -10

    # Delete corrupt DB backups (safe — HA already gave up on them)
    kubectl exec -n home <pod> -- rm /config/home-assistant_v2.db.corrupt.*
    ```

    ### Expanding a full PVC
    ```bash
    kubectl patch pvc <name> -n <ns> -p '{"spec":{"resources":{"requests":{"storage":"<new-size>"}}}}'
    # Longhorn expands online — no pod restart needed. Verify:
    kubectl exec -n <ns> <pod> -- df -h <mountpath>
    ```

    ## Common Fixes

    ### Stuck Terminating pods
    ```bash
    kubectl delete pod -n <ns> <name> --force --grace-period=0
    ```

    ### Stuck Terminating PVC (missing Longhorn volume)
    ```bash
    kubectl patch pvc <name> -n <ns> -p '{"metadata":{"finalizers":[]}}' --type=merge
    kubectl delete pod -n <ns> <statefulset-pod>   # force StatefulSet to create fresh PVC
    ```

    ### CrashLoopBackOff / Error pods (deployment-managed)
    Delete the pod — the deployment/StatefulSet will reschedule it:
    ```bash
    kubectl delete pod -n <ns> <name>
    ```

    ### Longhorn CSI pods in Error
    ```bash
    kubectl delete pods -n longhorn-system -l app=csi-attacher
    kubectl delete pods -n longhorn-system -l app=csi-provisioner
    kubectl delete pods -n longhorn-system -l app=csi-resizer
    kubectl delete pods -n longhorn-system -l app=csi-snapshotter
    ```

    ### Traefik — Completed pods accumulating
    ```bash
    kubectl get pods -n traefik --no-headers | grep Completed | awk '{print $1}' | xargs kubectl delete pod -n traefik
    ```

    ### Traefik — ingress not routing (.v2.local domains)
    `.v2.local` is an internal domain — cert-manager HTTP-01 will never succeed. If an ingress has a missing TLS secret, Traefik silently drops the whole route.

    Fix: remove TLS spec and cert-manager annotations, set entrypoint to `web` only:
    ```bash
    kubectl patch ingress <name> -n <ns> --type=merge -p '{"spec":{"tls":null}}'
    kubectl annotate ingress <name> -n <ns> \
      cert-manager.io/cluster-issuer- kubernetes.io/tls-acme- \
      traefik.ingress.kubernetes.io/router.entrypoints=web --overwrite
    ```
    Check Traefik logs for the full list of broken ingresses:
    ```bash
    kubectl logs -n traefik -l app.kubernetes.io/name=traefik --tail=50 | grep "secret.*does not exist"
    ```

    ### Democratic CSI can't reach TrueNAS
    - NAS is at `10.0.0.10`, HTTP port 80, SSH port 22
    - Config secret: `zfs-nfs-democratic-csi-driver-config` in `democratic-csi`
    - Values file: `/home/mattias/projects/hrb/v2-cluster/storage/nfs-values.yaml`

    ### Bulk-delete failed cronjob pods (samma/samma-io scan jobs)
    ```bash
    kubectl delete pods -n samma --field-selector=status.phase=Failed
    kubectl delete pods -n samma-io --field-selector=status.phase=Failed
    kubectl get pods -n samma-io --no-headers | grep -v Running | awk '{print $1}' | xargs -r kubectl delete pod -n samma-io
    ```

    ## Known Pre-existing Issues (do NOT try to fix without investigation)
    - `democratic-csi/zfs-iscsi-*` — iSCSI controller may CrashLoop if NAS iSCSI is misconfigured; check separately
    - `samma/audit-log-collector` — CrashLoopBackOff long-standing; low priority
    - `frigate/frigate` ingress — "service not found"; frigate is being reconfigured with new deployment YAMLs

    ## Audit Commands
    ```bash
    # Unhealthy pods
    kubectl get pods -A --no-headers | grep -v "Running\|Completed\|Succeeded" | awk '{print $1, $2, $4}' | sort

    # Traefik errors
    kubectl logs -n traefik -l app.kubernetes.io/name=traefik --tail=50 | grep -E "ERR|error" | sort -u
    ```

