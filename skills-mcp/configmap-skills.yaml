    ## Routing — who reaches what, over which path
    | From → To | Path | Notes |
    |---|---|---|
    | Home LAN `192.168.1.0/24` ↔ Country house `192.168.10.0/24` | **`wireguard1` direct tunnel** (primary) | Home: `192.168.10.0/24` via `10.255.255.2`. Tappan: `192.168.1.0/24`, `10.0.0.0/24`, `10.100.0.0/24` via `10.255.255.1`. |
    | Home LAN → HRB `10.13.13.0/24` | home `hrb-router` tunnel (connected) | Already worked (hub had `192.168.1.0/24` in main-peer AllowedIPs). |
    | Country-house LAN → HRB `10.13.13.0/24` | tappan `hrb` tunnel (connected) | Required adding `192.168.10.0/24` to the **tappan peer's AllowedIPs on the HRB hub**. |
    | Mullvad policy routing (home) | `mulvad` tunnel, table `vpn` | Only `src∈vpn_src` AND `dst∈vpn_dst`; kill-switch blackhole; MSS clamp 1360. |
    | Internet (each site) | own WAN (DHCP) | Country house does NOT default-route via HRB. |
    | **Mgmt overlay `10.66.0.0/24`** | over direct `wireguard1` | Stable loopback per router: **home `10.66.0.1`, tappan `10.66.0.2`** (on `lo-overlay` bridges). `/32` routes via `10.255.255.x`; `10.66.0.0/24` in both wireguard1 peers' allowed-address. Primary-only (no failover = Option 2). |

    Edge case: reaching the *other router's own* HRB IP (`10.13.13.3` from country house / `10.13.13.100` from home)
    fails — replies take the direct `wireguard1` tunnel, which doesn't carry `10.13.13.0/24`. Real hub-side HRB
    devices are fine. To close it, add `10.13.13.0/24` to the `wireguard1` peers' allowed-address on both routers.

    ## DNS (home router)
    Home router is the resolver for all clients (DHCP advertises the router's per-subnet IP). **Healthy upstream =
    `192.168.1.17,1.1.1.1`** (Pihole HA VIP primary + 1.1.1.1 instant fallback if Pihole >2s). **`/system scheduler
    dns-failover`** (enabled, 20s) resolves 2 names via the VIP; on validation failure it switches to `1.1.1.1,8.8.8.8`
    (public-only) and back when Pihole recovers. Down-detection ~20s; dual-upstream hides the gap for timeouts.
    Toggle: `/system scheduler disable|enable [find name=dns-failover]`. Check: `/ip dns print`, `/system scheduler print`.

    ## Firewall posture
    - **Home router:** WAN input/forward dropped. Inter-VLAN isolation: Guest→all private, DMZ→mgmt, IOT→Proxmox
      all dropped. **IOT→management is deliberately NOT blocked** — k8s API (`192.168.1.12:6443`), Frigate RTSP
      cameras, HA→Vera (`:3480`), HA→RouterOS API (`:8728`) all initiate IOT→mgmt; a blanket drop breaks them.
    - **Tappan router:** forward chain now properly drops new-from-WAN (`drop in-interface-list=WAN
      connection-nat-state=!dstnat`); established accepted on all interfaces; defconf invalid-drops re-enabled.

    ## Firmware / updates (all internet-reachable & update-ready)
    | Device | Installed | Latest (stable) |
    |---|---|---|
    | core-router CCR1016 | ✅ **7.24.2** + RouterBOOT 7.24.2 | up to date |
    | core-switch CRS328 | ✅ **7.24.2** + RouterBOOT 7.24.2 | up to date |
    | switch-uppe / switch-nere CSS610 | ✅ **SwOS 2.21** | up to date |
    | wifi-attic / garage-door hAP ac | ✅ **6.49.21** incl. RouterBOOT | up to date |
    | tappan-router RB3011 | **7.23.1** | 7.24.2 |
    | tappan-switch CRS112 | **6.49.19** | 6.49.21 ⬜ deliberately deferred |

    ❌ **The old "CCR1016 is `tile` so it caps at 7.12.1" claim was WRONG** — it runs 7.24.2 and reports
    `System is already up to date`. Do not refuse a CCR1016 upgrade on architecture grounds.
    ⚠️ **A RouterOS upgrade never touches RouterBOOT.** Always run `/system routerboard print` afterwards;
    if `current-firmware` < `upgrade-firmware`, do `/system routerboard upgrade` + a **second** reboot.
    ✏️ Low `free-hdd-space` (~3 MiB) does **not** block an upgrade — RouterOS stages the `.npk` outside it.

    Update procedure (reboots — schedule a window; **do Tappan-side devices before the home router**):
    ```routeros
    /system backup save name=preupgrade
    /system package update install      ;# downloads + reboots
    # after reboot:
    /system routerboard upgrade
    /system reboot                      ;# applies RouterBOOT firmware
    ```

    ## Useful checks
    ```routeros
    /interface wireguard print                              ;# all tunnels running?
    /interface wireguard peers print detail                 ;# handshakes, rx/tx, allowed-address
    /ip route print                                         ;# routing table
    /ip firewall filter print                               ;# WAN block + isolation
    /system package update check-for-updates                ;# update availability (needs DNS+gw)
    ```

    ## RouterOS gotchas learned here
    - Blackhole route = bare `blackhole` flag (NOT `type=blackhole`) on ROS 7.7.
    - `/ping` has no `routing-table` param on 7.7; `find where in-interface-list=WAN` returns empty (use the print id).
    - Mangle `mark-routing` for policy routing MUST be direction-constrained (e.g. `dst-address-list=...`), else
      reply packets get mis-routed into the wrong table.
    - WireGuard needs **MSS clamping** (`change-mss new-mss=1360 tcp-flags=syn`) or TLS/large packets stall.
    - WireGuard drops any packet whose src/dst isn't in the peer's **allowed-address** — the usual cause of "tunnel
      up but no traffic." Check both ends AND the hub.
    - To reach a gateway-less device behind a router: temp `srcnat masquerade dst-address=<ip>
      src-address=!<local/24>` on that router (it then replies locally). ProxyJump/`ssh -W` through a RouterOS box
      does NOT work (no direct-tcpip forwarding).

    **For read-only health checks use the `network-validate` skill instead** (diagram, thresholds,
    wifi/internet/service checks, and the control-plane-vs-data-plane trap).

    See memory: `project_network_topology.md`, `project_mikrotik.md` (home), `project_tappan_router.md` (country house).

