    ## 4. Bathroom fan — humidity control (badrum)

    Extractor fan in the bathroom, driven off humidity so a shower never leaves the room damp
    (mold prevention). Built 2026-09-02.

    | Role | Entity | Notes |
    |---|---|---|
    | Fan | `switch.0xa4c13800576effff` | z2m **`badrumsVentp2`**, Tuya plug w/ metering. ~8–14 W load |
    | Humidity | `sensor.badrumuppe_humidity` | z2m **`badrumUppe`** (`0xc4d8c8fffe192267`). **Swapped in 2026-09-02** — the automation used to read `sensor.0xc4d8c8fffe193142_humidity` (z2m `description` "Kontoret"), which is **not in the bathroom** and read ~12 pp low (46 % vs 59 % side by side). That entity is now unused by this automation. |
    | Baseline | `sensor.badrum_fukt_baslinje` | **Statistics** helper (config-entry, not YAML): 6 h rolling `mean` of the humidity sensor, `sampling_size` 200, `keep_last_sample` true. ⚠️ **A statistics helper's source `entity_id` is READ-ONLY in its options flow** — repointing it means delete + recreate the config entry, and the new entity comes back as `sensor.badrumuppe_badrum_fukt_baslinje` (HA prefixes the source device name). Rename it back with WS `config/entity_registry/update` + `new_entity_id` so the automation and dashboards keep working. |
    | Flags | `input_boolean.badrum_flakt_auto` | "this run was started by the automation" — a **manual** fan start is neither auto-stopped nor capped |
    | | `input_boolean.badrum_flakt_sparr_maxtid` | lockout latch, set by the 60-min cap, cleared when humidity returns to normal |

    **Automation** `automation.badrum_flakt_fuktstyrning` (id `1788010000001`, alias
    `Badrum - flakt fuktstyrning`).

    **Relative, not absolute.** House humidity drifts ±15 pp across seasons, so a fixed
    threshold either runs the fan all summer or never fires in winter. Thresholds are offsets
    from the sensor's own 6-hour mean, defined **once** in the automation's `variables:` block:

    | Constant | Value | Meaning |
    |---|---|---|
    | `start_offset` | 8 | start when `hum ≥ baseline + 8` |
    | `stop_offset` | 3 | stop when `hum ≤ baseline + 3` (5 pp hysteresis → no short-cycling) |
    | `abs_ceiling` | 75 | absolute backstop — start regardless of baseline |
    | `abs_stop` | 60 | fallback stop level if the baseline sensor is unavailable |

    At baseline ≈ 50 % that is **start 58 % / stop 53 %**. A shower is +20–30 pp in minutes.
    6 h is chosen so a 30-min shower moves the mean only ~2 pp (the delta stays large while the
    fan is needed) while still tracking seasonal drift.

    **Shape: dumb triggers, one decision point.** Triggers only say "re-evaluate" — humidity
    state change, `/5 min`, HA start, plus `fan on for 01:00:00` (id `maxtid`). All logic sits in
    one `choose` in the action. Deliberately **not** edge-triggered: same lesson as
    `frigate_detect_sync` — transition-only home automations fail silently after a restart or a
    dropped Zigbee command. The `/5 min` branch re-asserts the correct fan state and clears the
    lockout, so the whole thing is self-healing.

    Branch order (first match wins):
    1. `maxtid` **and** `auto` on → fan off, set lockout, clear `auto`. 60-min cap; a stuck
       sensor can never hold the fan on. Gated on `auto` so a manual run is not cut short.
    2. `hum < 0` (sensor `unknown`/`unavailable`) → **do nothing**. Both `float()` calls carry a
       `-1` default precisely so stale data lands here instead of comparing strings.
    3. `hum ≤ stop_t` → clear lockout; if `auto` on, fan off + clear `auto`.
    4. `hum ≥ start_t` **and** lockout off → set `auto`, fan on.

    **Changing the humidity source** = repoint the statistics helper (see the Baseline row above),
    then replace the entity id in **both** places in the automation: the `sync` state trigger and the
    `hum` variable. After a swap the baseline needs ~6 h to settle — it backfills from whatever recorder
    history the new entity has, so right after the change it can sit *above* the live reading. That is
    safe: `base` only ever raises `start_t`, and if the baseline is missing entirely the `abs_ceiling` 75
    backstop applies.

    **Tuning** = edit `start_offset` / `stop_offset` in the automation's `variables:` block, then
    `POST /api/services/automation/reload`. Nothing else references them.

    **Testing without a shower** — inject a reading and watch the plug:
    ```
    POST /api/states/sensor.badrumuppe_humidity
         {"state":"85","attributes":{"unit_of_measurement":"%","device_class":"humidity"}}
    ```
    The fan flips within ~5 s; POST a low value to release it. The injected state is transient
    (the next MQTT report overwrites it) but it **does** enter the statistics buffer, nudging the
    baseline ~1 pp for 6 h.
    ⚠️ **Confirm the plug with `sensor.0xa4c13800576effff_current`, not `_power`.** The power
    sensor is coarse and late — it read 0 W through a verified 30 s on-window while `current`
    correctly showed 0.06 A. Same trap as the stale EV-charger switch in §2: use the sensor that
    actually moves as the *signal*.

