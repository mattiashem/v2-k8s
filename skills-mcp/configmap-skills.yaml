    ---
    name: v2-home
    description: Control the v2.local Home Assistant: solar/battery (Growatt), EV and night charging, alarm and presence, bathroom fan, and generic entity/service calls. Use when asked to read or change anything in the house — lights, heating, charging, alarm, sensors. Controls real hardware and mains power.
    ---

    # v2-home — Home Assistant Ops (ha.v2.local)

    Operational runbook for the **cluster Home Assistant** that runs the house: solar/battery (Growatt),
    EV charging (Charge Amps), night battery charge (Nord Pool), alarm/presence, and generic entity control.
    Written so **any agent** (Claude Code, openclaw, zoe) can drive it. Everything is HTTP/WS against HA's API.

    > This controls **real hardware and mains power** (battery grid-charge imports money, the EV charger,
    > the house alarm). Prefer read/status calls first; confirm before flipping switches or arming/disarming
    > the alarm unless the user clearly asked for that specific action.

    ---

    ## 0. Connect & authenticate

    **Target:** cluster HA = service `homeassistant` in ns `home`, port 8123. HA **2026.6.2**, currency SEK.

    | Caller | Base URL |
    |---|---|
    | In-cluster agent (openclaw/zoe/pod) | `http://homeassistant.home.svc.cluster.local:8123` (or `http://homeassistant.home:8123`) |
    | External / via ingress | `http://ha.v2.local` (Traefik, SSL off) |
    | Local dev (Claude Code on laptop) | port-forward: `kubectl port-forward -n home svc/homeassistant 18123:8123` → `http://localhost:18123` |

    **Auth:** long-lived token (HA → profile → Long-Lived Access Tokens). Send `Authorization: Bearer $HA_TOKEN`.
    Set `HA_URL` + `HA_TOKEN` in the environment. Quick check: `GET $HA_URL/api/` → `{"message":"API running."}`.

    **Core API surface**
    - `GET  /api/states` — all entity states; `GET /api/states/<entity_id>` — one.
    - `POST /api/services/<domain>/<service>` body `{"entity_id": "...", ...}` — call a service.
      Add `?return_response` for actions that return data (e.g. `nordpool.get_prices_for_date`).
    - `POST /api/template` body `{"template":"{{ ... }}"}` — render a Jinja template (great for validating logic).
    - `GET/POST /api/config/automation/config/<id>` — read/write an automation (POST body = full config JSON).
    - WebSocket `/api/websocket` (auth handshake) — needed for **helpers** (`input_*/create`) and **dashboards**
      (`lovelace/config`, `lovelace/config/save`). Needs the `websockets` py lib.

    **Reusable helper** (mirrors what past sessions used — save as `ha.py`):
    ```python
    import json, urllib.request, os
    BASE=os.environ["HA_URL"]; TOKEN=os.environ["HA_TOKEN"]
    def req(path, data=None, method=None):
        r=urllib.request.Request(BASE+path, data=(json.dumps(data).encode() if data is not None else None),
            headers={"Authorization":f"Bearer {TOKEN}","Content-Type":"application/json"}, method=method)
        return urllib.request.urlopen(r).read().decode()
    def state(eid): return next((s["state"] for s in json.loads(req("/api/states")) if s["entity_id"]==eid), None)
    def tmpl(t):  return req("/api/template", {"template": t})
    def svc(dom_svc, data): return req(f"/api/services/{dom_svc}", data)
    ```

    ---

    ## 1. Solar + battery (Growatt "KJN6EXV00B", integration growatt_server)

    **Status entities** (all prefix `sensor.kjn6exv00b_`):
    - `state_of_charge_soc` (%), `export_power` / `import_power` / `local_load_power` / `output_power` (W),
      `battery_1_discharging_w` + `battery_2_discharging_w` (W drain), `battery_1_charging_w`.

    **Control levers**
    - `switch.kjn6exv00b_charge_from_grid` — **AC charge** (fill battery from grid). ★ **This is the only lever
      that actually stops the battery from discharging** (forces grid). Turn ON to protect the battery.
    - `number.kjn6exv00b_battery_charge_soc_limit` — charge STOP SOC (%).
    - `number.kjn6exv00b_battery_charge_power_limit` — charge power (%). Set 100 for max charge rate.
    - `number.kjn6exv00b_battery_discharge_power_limit` — nominal discharge lock (0=lock, 100=free).
      ⚠️ **On this inverter, setting 0 does NOT reliably stop discharge** (tested: still fed a car load at 6.3 kW).
      Use it as belt-and-suspenders only; real protection = `charge_from_grid` on.
    - `number.kjn6exv00b_battery_discharge_soc_limit_on_grid` — proper lever, but `unavailable` on this unit.

    **Solar surplus flag** — `input_boolean.solar_surplus`, driven by `automation.soloverskott_utvardera`:
    ON when SOC ≥ 90% AND export > 500 W; OFF when SOC < 85% OR export < 150 W (hysteresis). Use it to gate
    opportunistic loads. The solar-follow EV charge (`billaddning_soloverskott`) also sets discharge=0 on surplus.
    ⚠️ **`export_power` clamps at 0 the moment the house imports** — it can show a surplus but never a deficit.
    Any power-balance maths must subtract `import_power` too, or it goes blind once load exceeds PV.
    **house load = `local_load_power` − `vetevagen_connector_1_power`** (`local_load_power` includes the car).

    **Growatt writes are intermittently flaky** (`GrowattV1ApiError`). ALWAYS wrap in retry-until-state loops
    with `continue_on_error: true`; a retry usually succeeds. Sensors poll ~5 min, so state reflection lags.

    ---

    ## 2. EV charging + night battery charge

    **EV charger** = Charge Amps "Vetevägen":
    - `switch.vetevagen_connector_1` (on/off), `number.vetevagen_connector_1_max_current` (A, 6–32; 3-phase ≈690 W/A),
      `binary_sensor.vetevagen_connector_1_cable_connected`, `sensor.vetevagen_connector_1_power`,
      `sensor.vetevagen_connector_1_status`. ⚠️ Charge Amps ignores `max_current` writes while idle — but they
      **do stick during an active session** (verified 2026-08-01: 16→10 A dropped the car 8668→6690 W in 30 s;
      the entity itself lagged ~90 s). So always start the session first, *then* set the current.
    - ⚠️ **`_status` = `Unavailable` while idle is NORMAL, not a fault** — cable/status/power only read true
      during a live session. Don't diagnose a dead charger from it. A single poll can also return a garbled
      reading, so never conclude from one sample.
    - ⚠️ **OPEN BUG: `switch.vetevagen_connector_1` goes stale**, reading `off` while the car charges at 8.6 kW
      (sensors kept refreshing every 30 s). Consequences in `billaddning_soloverskott`: the start gate
      `if switch == off → turn_on + Telegram` re-fires **every 5 min** during a charge, and the default branch
      `if switch == on → turn_off` can **never stop** a solar charge. Use `_status == 'Charging'` or
      `_power > 1000` as the *signal*; keep the switch only as the *command*.

    **Solar-following EV charge** — `automation.billaddning_soloverskott` (id `1782808226302`). Branch order:
    `ladda_elbilen_nu` on → defer ▸ `car_charge_from_grid` on → grid branch ▸ `solar_surplus` on → solar branch
    ▸ else release all. Solar branch step order matters (fixed 2026-08-01):
    charge_from_grid on → charge_soc_limit 10 → discharge_limit 0 → **charger on + Telegram** → `max_current`.
    `max_current` used to run *before* the charger turn-on and was the only step without `continue_on_error`,
    so a raise there aborted the run before charging ever started — silently. Amps:
    `(export + car_power − import − 200)/690`, clamped 6–16. The `− import` term was added 2026-08-01; without
    it the formula was blind to a deficit (said 12 A while importing 1.2 kW with the house drawing ~1.3 kW).
    Note `target_amps ≥ 6` means **PV − house must exceed ~4.3 kW** before charging starts at all.

    **Manual "charge now" with battery protection** — button `input_boolean.ladda_elbilen_nu`, controller
    `automation.ladda_elbilen_nu_styrning` (mode restart). ON runs a timed, verified sequence: protect battery
    first (charge_from_grid on + discharge=0 + set `input_datetime.bil_batteriskydd_slut`=now+1h) → Telegram
    "startar om 5 min" → wait 6 min → start charger (car_charge_from_grid on + charger on + 16 A) → wait 5 min →
    **verify** `battery_1+2_discharging_w`; if >200 W → Telegram + drop current to 6 A. OFF releases everything
    (charge_from_grid off, discharge=100). Guard `automation.bil_laddningsvakt_batteriskydd` (/10 min) self-heals
    a dropped charge_from_grid, re-checks drain, and on solar surplus asserts discharge=0 (protect, no import).
    Helper `input_boolean.car_charge_from_grid` is the override `billaddning_soloverskott` reacts to.

    **Night battery charge (cheapest contiguous hours)** — planner + executor:
    - `automation.nattladdning_planera_fonster` (22:00 + on HA start): calls `nordpool.get_prices_for_date` for
      today+tomorrow, finds the cheapest **contiguous** N-hour block in span [today 22:00 → tomorrow 08:00],
      writes `input_datetime.nattladdning_start` / `nattladdning_slut`.
    - `automation.nattladdning_kor_fonster` (time-trigger at those datetimes + /15 keepalive): charge battery+car
      during the window (charge_from_grid on, charge power 100, stop-SOC = target), release + restore after.
    - Helpers: `input_boolean.nattladdning_aktiv` (master), `input_number.nattladdning_timmar` (block length, def 4),
      `input_number.nattladdning_mal_soc` (target SOC, def 100).

    **Nord Pool** (integration, area SE3): action `nordpool.get_prices_for_date`
    (`config_entry: 01KRY9DGJ57F9046Q7JBC9Y6CF`, `areas: SE3`) → **96 slots/day @ 15-min** (`{start,end,price}`,
    SEK/MWh). Cheapest contiguous window = min-sum sliding window of `hours*4` slots. Next-day prices publish ~13:00.

