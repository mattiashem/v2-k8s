    ---
    name: k8s-v2-ops
    description: Diagnose and repair the LOCAL k8s cluster (v2cluster): failing pods, stuck ingresses, Longhorn storage, ArgoCD sync, node problems. Use when asked why a cluster service is down, broken or not syncing. Never targets the HRB mail cluster.
