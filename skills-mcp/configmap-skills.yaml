    ---
    name: network-validate
    description: Read-only health sweep of the home network, wifi, internet and core k8s services. Use when asked "is everything up?", "check the network", "is the wifi ok", "is the internet working", "are the services healthy", or when a user reports slowness or high ping. Produces a HEALTHY/DEGRADED/BROKEN verdict against 16 fixed thresholds. Never changes anything.
    ---

    # network-validate — Validate the Network, Wifi, Internet and Core Services

    A **read-only** validation runbook. Written so **any agent** (Claude Code, openclaw, zoe, a cron job)
    can run a full health sweep and produce a verdict without knowing the network in advance.

    > **This skill never changes anything.** Every command here is a read, a ping or an HTTP GET.
    > To *change* the network use the separate `network-ops` skill instead.
    > **Never touch the HRB mail cluster** (`~/.kube/confighrb`) — not even reads — without explicit
    > per-action approval from the user. Everything here targets the LOCAL cluster and the home
    > MikroTiks only.

    ---

