    ## 5. Generic HA control (building block)

    - **Read:** `state("switch.x")`, or `GET /api/states/<id>`. Render logic with `POST /api/template`.
    - **Set a switch/boolean/number:**
      `svc("switch/turn_on", {"entity_id":"switch.kjn6exv00b_charge_from_grid"})`,
      `svc("number/set_value", {"entity_id":"number.vetevagen_connector_1_max_current","value":16})`,
      `svc("input_boolean/turn_off", {"entity_id":"input_boolean.larm"})`.
    - **Call any action with response:** `POST /api/services/<dom>/<svc>?return_response`.
    - **List automations:** filter `/api/states` for `automation.*` (attr `id`, `last_triggered`); trace via
      WS `trace/list` + `trace/get`.
    - **Create/edit an automation:** `POST /api/config/automation/config/<id>` with the full config, then
      `POST /api/services/automation/reload`. **Create helpers** via WS (`input_boolean/create`,
      `input_number/create`, `input_datetime/create`). **Edit dashboards** via WS `lovelace/config` +
      `lovelace/config/save` (url_path `energy-home`).

    Retry pattern for flaky (Growatt) writes:
    ```yaml
    repeat:
      sequence:
        - {action: switch.turn_on, target: {entity_id: switch.kjn6exv00b_charge_from_grid}, continue_on_error: true}
        - {delay: {seconds: 4}}
      until: [{condition: template, value_template: "{{ is_state('switch.kjn6exv00b_charge_from_grid','on') or repeat.index >= 5 }}"}]
    ```

    ---

    ## ⚠️ Gotchas (learned the hard way)

    1. **discharge_power_limit=0 does NOT stop this Growatt discharging.** Protect the battery with
       `switch.kjn6exv00b_charge_from_grid` ON, and **verify** via `battery_1/2_discharging_w ≈ 0`.
    2. **Reload after POST:** a new automation from `/api/config/automation/config/<id>` is "missing/not
       available" for service calls until `POST /api/services/automation/reload`.
    3. **Automation entity_id is slugified from `alias`, NOT the POSTed `id`.** e.g. alias
       "Bil - laddningsvakt (batteriskydd)" → `automation.bil_laddningsvakt_batteriskydd`. Query by alias-slug.
    4. **Growatt writes are intermittently flaky** — retry-until-state + `continue_on_error` everywhere.
    5. **HA template *conditions* run through `result_as_boolean`** (any non-empty string → the wrong thing).
       Make condition templates evaluate to a real bool: `{{ ... | count > 0 }}`, `{{ (x|trim) == 'True' }}`.
    6. **Nord Pool** gives no hourly list as sensor attributes — use the `get_prices_for_date` action.
    7. **Charge Amps** ignores `max_current` while idle; only applies during an active charging session.
    8. HA config lives on a **PVC, not git** — automations/dashboards are created via API, not GitOps.
    9. **Order + `continue_on_error` decide whether a sequence completes.** One un-guarded step that raises
       aborts everything after it, silently — no Telegram, no charger start. Put the action that matters
       (start the charger) *before* the flaky writes, and mark every optional write `continue_on_error: true`.
    10. **`GET /api/history` does NOT record automation `last_triggered`** — an `automation.*` entity returns a
       single row over days. You can **never** conclude "it didn't fire" from history. Infer from the history
       of the entities it *writes to*, from `/api/error_log`, or from WS `trace/list`+`trace/get` (last ~5 runs).
       Also: history defaults to a **1-day** window — pass `?end_time=<iso>` or longer queries truncate silently.
    11. **`export_power` clamps at 0 during import** — see §1. Power-balance maths needs `− import_power`.

