    ## 1. Access

    All MikroTik logins are user `admin`. **Passwords are NOT stored in this file** (it lives in a
    GitHub-backed repo) — read them from the project `CLAUDE.md` and from memory
    `project_capsman_aps` (APs + CRS328) and `project_tappan_router` (country house).
    Export them into the shell first, then build the helpers:

    ```bash
    # PW_ROUTER = core-router password; PW_DEVICES = the shared AP/CRS328/tappan password
    RT="sshpass -p \"$PW_ROUTER\"  ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 admin@192.168.1.1"
    SW="sshpass -p \"$PW_DEVICES\" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 admin@192.168.1.3"
    CH="sshpass -p \"$PW_DEVICES\" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 admin@192.168.10.1"
    ```

    ⚠️ **Never chain RouterOS commands with `;` over one-shot ssh** — it fails silently in a way that
    looks like bad credentials. One command per ssh invocation.

    The two CSS610s run **SwOS — no SSH at all**. Read them over HTTP with digest auth and an **empty
    password**; the reply is a hex-encoded struct (`i06`=version, `i05`=identity, `i07`=board,
    `i04`=serial, `i01`=uptime seconds):

    ```bash
    curl -s --digest -u admin: http://192.168.1.7/sys.b   # switch-uppe
    curl -s --digest -u admin: http://192.168.1.8/sys.b   # switch-nere
    # decode with: python3 -c "import sys;print(bytes.fromhex(sys.argv[1]).decode())" <hex>
    ```

    ---

    ## 2. Validate the network

    ### 2.1 🔴 The single most important rule — control plane vs data plane

    **Do NOT judge the LAN by pinging `192.168.1.1` or `192.168.1.3`.** A MikroTik answers pings to its
    *own* management IP from its **CPU**, at the lowest priority. That number spikes to 20–35 ms during
    routine CPU work and for several minutes after any reboot, while forwarding is completely unaffected.

    **Always ping a real host behind the switch instead:**

    ```bash
    ping -c 300 -i 0.02 -q 192.168.1.15   # talos-wyx-ktb — data plane
    ping -c 300 -i 0.02 -q 192.168.1.2    # HA box — data plane
    ```

    Verified-good baseline (2026-09-05): **avg 0.23 ms, max 0.85 ms, mdev 0.12 ms, 0% loss.**
    If data-plane latency is that low, **the network is healthy — report it as healthy** no matter what
    the ping to `.1` says.

    ### 2.2 Link speeds and errors

    ```bash
    eval $SW '"/interface ethernet monitor [find running] once"' | tr -s ' ' | grep -E '^ name:|^ rate:'
    eval $RT '"/interface ethernet monitor [find running] once"' | tr -s ' ' | grep -E '^ name:|^ rate:'
    eval $SW '"/interface ethernet print stats-detail where name=ether1"' | grep -oE '(rx-fcs-error|rx-fragment|rx-jabber|tx-collision|tx-drop-packet)=[0-9 ]+'
    ```

    Expected: `SW10GB` / `sfp-sfpplus1` = **10 Gbps**; WAN `sfp2` = 1 Gbps; `ether1` (node1) = 1 Gbps;
    all error counters **0**.

    **Interpreting a port stuck at 100 Mbps** — compare the two advertising lines:

    ```bash
    eval $SW '"/interface ethernet monitor etherN once"' | tr -s ' '
    ```

    - **Both** `advertising:` and `link-partner-advertising:` truncated at 100M → **stale autoneg on our
      side, fixable**: force `advertise=...,1000M-full` (this is what fixed wifi-attic's ether2).
    - **Only** `link-partner-advertising:` truncated → the **far device or its cable** is the limit.
      Do not force anything; it will just break the link.

    Currently 100M and **all confirmed partner-side limits (normal, not a fault)**: `ether4` reolink,
    `ether10` printer, `ether6 12 14 15 19 20 22` misc IoT.

    ### 2.3 Hardware offload and fastpath (why the LAN is fast)

    ```bash
    eval $SW '"/interface bridge port print"'          # every port must show the H flag
    eval $RT '"/ip firewall filter print stats where action=fasttrack-connection"'   # counters must climb
    ```

    `H` missing on a CRS328 port = that port fell back to CPU switching → a real performance problem.
    The **core-router has no switch chip** (its bridge is CPU-based by design) — expected, not a bug.

    ### 2.4 Routing and the WireGuard tunnels

    ```bash
    eval $RT '"/interface wireguard print"'                  # all 3 must show R (running)
    eval $RT '"/interface wireguard peers print detail"'     # check last-handshake on each
    eval $RT '"/ip route print where active"'
    for t in 10.13.13.1 192.168.10.1 10.66.0.2 1.1.1.1; do
      echo -n "$t  "; eval $RT "\"/ping $t count=3\"" | grep -o 'packet-loss=[0-9]*%'
    done
    ```

    | Tunnel | Peer | Must be | Carries |
    |---|---|---|---|
    | `wireguard1` 10.255.255.1 | tappan `100.68.234.27:13231` | running, handshake < 5 min | site-to-site: `192.168.10.0/24` + overlay `10.66.0.2/32` |
    | `hrb-router` 10.13.13.3 | `65.21.254.116:51820` | running, handshake < 5 min | **only** `10.13.13.0/24` (mail cluster). No default route |
    | `mulvad` 10.71.219.30 | Mullvad `185.65.135.68:51820` | running, handshake < 1 min | policy-routed exit — **test scope only** |

    All four pings must be **0% loss**. A `last-handshake` older than ~5 minutes with traffic pending
    means the tunnel has stalled.

    **Mullvad policy routing** (`vpn_src` → `vpn_dst` → routing table `vpn`):

    ```bash
    eval $RT '"/ip firewall address-list print where list~\"vpn\""'
    eval $RT '"/ip route print detail where comment~\"kill\""'   # must be: blackhole, table vpn, distance 10
    ```

    The blackhole at distance 10 is the **kill-switch** — if it is missing, a Mullvad outage leaks traffic
    to the plain WAN. Current scope is intentionally tiny: `vpn_src` = 192.168.1.70 only,
    `vpn_dst` = whatsmyip.org + ipinfo.io only.

    ---

    ## 3. Validate wifi

    Wifi is **CAPsMAN v1** (`/caps-man`, legacy) hosted on the core-router. The APs hold no config of
    their own that matters — client traffic is tunnelled to the router (`local-forwarding=no`).

    ```bash
    eval $RT '"/caps-man remote-cap print"'                          # both APs, STATE must be "Run"
    eval $RT '":put [:len [/caps-man registration-table find]]"'     # client count
    eval $RT '"/caps-man interface print detail where !disabled"' | grep -oE 'current-channel=[^ ]*'
    eval $RT '"/caps-man channel print"'                             # the pinned frequencies
    ```

    | Check | Pass condition |
    |---|---|
    | APs joined | **2** caps, state `Run`, **2 radios each** (`wifi-attic` + `garage-door`) |
    | Clients | **~8** typical. A sudden drop to ~6 means an AP dropped out |
    | 🔴 Channels | **must be 2412, 5180, 2462, 5240** — all non-DFS |

    **🔴 The channel check is the critical one.** If any radio is not pinned it will re-select a
    **weather-radar DFS channel**, and that radio then goes silent for minutes at a time whenever radar
    is detected. Four channel profiles exist: `ch-2g-ch1` (2412), `ch-2g-nonoverlap` (2462),
    `ch-5g-nodfs` (5180–5240), `ch-5g-ch48` (5240).

    Known-normal quirks — do **not** report these as faults:

    - `remote-cap print` showing `[18:FD:74:48:6D:66]` instead of `wifi-attic`: CAPsMAN **caches the AP
      identity at join time**, so after a reboot it can show the MAC. Cosmetic only. Cleared by bouncing
      `/interface wireless cap set enabled=no` then `=yes` **on the AP**.
    - `garden` cAP ac at **10.0.0.34 is locked out** of all management — a known, unfixed coverage hole
      in the garden. Needs physical access. Not a regression.

    ---

    ## 4. Validate internet

    ```bash
    eval $RT '"/ping 1.1.1.1 count=3"' | grep -o 'packet-loss=[0-9]*%'      # raw IP reachability
    eval $RT '"/ip dns print"'                                              # servers = 192.168.1.17,1.1.1.1
    dig +short +time=3 +tries=1 @192.168.1.17 google.com                    # pihole resolving
    curl -s -m 15 https://ifconfig.me/ip                                    # normal exit → 155.4.221.50
    curl -s -m 15 https://ipinfo.io/json | grep -E '"ip"|"org"'             # Mullvad exit → 185.209.198.73 / AS39351
    ```

    `ipinfo.io` is in `vpn_dst`, so from **192.168.1.70** it must come back as a **Mullvad** address while
    `ifconfig.me` returns the ISP address. The same IP from both = policy routing or the tunnel is broken.

    The router self-heals DNS: a `dns-failover` scheduler runs every 20 s and switches
    `192.168.1.17,1.1.1.1` → `1.1.1.1,8.8.8.8` if pihole stops resolving. Check whether it fired:

    ```bash
    eval $RT '"/log print where message~\"dns-failover\""'
    ```

    ---

    ## 5. Validate core services (LOCAL cluster)

    ```bash
    kubectl get nodes -o wide
    kubectl get pods -A --field-selector status.phase!=Running,status.phase!=Succeeded
    kubectl get svc -A --field-selector spec.type=LoadBalancer
    ```

    **Node expectations.** 8 nodes exist. `node1`, `talos-wyx-ktb`, `turing-cp`, `turing1`, `turing2`,
    `turing3` must be **Ready**. **`node2` and `node3` FLAP** — they were Ready in Aug 2026 and are
    `NotReady,SchedulingDisabled` again as of 2026-09-05, with their switch ports `link-ok` but
    **rx-bytes = 0**. Report their state; do **not** treat them as either permanently dead or reliably back.

    ### 5.1 Service reachability (verified working 2026-09-05)

    `*.v2.local` is a **wildcard DNS record → 192.168.1.16 = the traefik LoadBalancer** (MetalLB).
    Every ingress host below resolves to that same IP and is separated by the `Host:` header.

    ```bash
    # traefik front door — expect HTTP 200
    curl -s -o /dev/null -w '%{http_code} %{time_total}s\n' -m 10 -H 'Host: ha.v2.local' http://192.168.1.16/
    # argocd — expect 200
    curl -s -o /dev/null -w '%{http_code}\n' -m 10 -k https://10.0.0.103/
    ```

    | Service | Endpoint | Check |
    |---|---|---|
    | **traefik** (front door for all `*.v2.local`) | `192.168.1.16:80/443`, IOT `10.0.0.108` | HTTP 200 with a `Host:` header |
    | **Home Assistant** | `ha.v2.local`, LB `192.168.1.43:8123` | see the `v2-home` skill for authenticated checks |
    | **pihole HA pair** | `192.168.1.17:53` (VIP), `10.0.0.117`, `10.0.0.105` | `dig @192.168.1.17 google.com` |
    | **ArgoCD** | `10.0.0.103:80/443` | HTTP 200. Note: **no app has auto-sync** |
    | **mosquitto MQTT** | `192.168.1.42:1883` lan, `10.0.0.100:1883` dmz | TCP connect |
    | **Frigate** | `frigate-inomhus.v2.local` `10.0.0.113`, `frigate-utomhus.v2.local` `10.0.0.109` | HTTP |
    | **Plex** | `192.168.1.41:32400` | HTTP |
    | **Grafana / InfluxDB** | `grafana.v2.local`, `influxdb.v2.local` | HTTP |
    | **zigbee2mqtt** | `zigbee.v2.local` | ⚠️ see the storage trap below |
    | **openclaw / zoe** | `openclaw.v2.local`+`dobby.v2.local`, `openclaw-zoe.v2.local`+`zoe.v2.local` | HTTP |
    | **n8n** | `n8n.v2.local`, `n8n-hrb.v2.local` | HTTP |
    | **photoprism / overseerr / prowlarr / deluge** | `*.v2.local` | HTTP |

    ### 5.2 ⚠️ Storage trap — an HTTP 200 is not proof a service is healthy

    Longhorn can report a volume `attached / healthy` with all replicas `RW` while the device returns
    **EIO on every read and write**. `ls` still works (page cache) and zigbee2mqtt's failure page keeps the
    pod `1/1 Running` and serving HTTP 200. **A liveness probe cannot see this.** To actually verify:

    ```bash
    kubectl exec -n <ns> <pod> -- sh -c 'cat /data/<somefile> >/dev/null && echo write-test > /data/.healthcheck && rm /data/.healthcheck && echo STORAGE-OK'
    ```

    Fix = scale the statefulset 0 → 1 to force a detach/reattach. There are **no Longhorn backups and no
    recurring snapshot jobs** on this cluster.

    ---

    ## 6. Pass / fail thresholds — the verdict table

    | # | Check | PASS | INVESTIGATE |
    |---|---|---|---|
    | 1 | Data-plane ping (192.168.1.15) | avg < 1 ms, max < 5 ms, 0% loss | loss > 0, or max > 20 ms |
    | 2 | Ping to 192.168.1.1 / .3 | **ignore unless > 50 ms sustained** | only meaningful if sustained AND check 1 also fails |
    | 3 | Router↔switch uplink | 10 Gbps | anything lower |
    | 4 | CRS328 bridge ports | `H` flag on every port | any port missing `H` |
    | 5 | Port error counters | all 0 | any FCS / fragment / jabber / collision / drop |
    | 6 | WireGuard tunnels | 3 running, handshakes < 5 min | any not running or stale |
    | 7 | Tunnel pings | 4/4 at 0% loss | any loss |
    | 8 | Mullvad kill-switch | blackhole route present, distance 10 | missing = leak risk |
    | 9 | CAPsMAN | 2 caps `Run`, 2 radios each, ~8 clients | a cap missing or client count halved |
    | 10 | 🔴 Wifi channels | 2412 / 5180 / 2462 / 5240 | **any DFS channel** |
    | 11 | Internet | 1.1.1.1 0% loss, pihole resolves | either failing |
    | 12 | Exit IPs | ISP 155.4.221.50 **and** Mullvad 185.209.198.73 differ | identical = PBR broken |
    | 13 | k8s nodes | 6 Ready (node2/node3 flap — report as-is) | any of the 6 NotReady |
    | 14 | Pods | no non-Running/Succeeded pods | any CrashLoop / Pending |
    | 15 | traefik front door | HTTP 200 | anything else |
    | 16 | Storage | real cat+write inside the pod succeeds | EIO despite "healthy" |

    ---

    ## 7. Report format

    Report a one-line verdict first, then only what is not PASS. Include the measured numbers, not
    adjectives. Explicitly separate **"broken"** from **"known-normal"** — the standing known-normal
    list is: `node2`/`node3` down, the `garden` cAP locked out, CAPsMAN showing MACs instead of names,
    tappan-switch on 6.49.19, and the 100 Mbps ports whose partners are genuinely 100M-only.

    ```
    NETWORK VALIDATION — <timestamp>
    VERDICT: HEALTHY | DEGRADED | BROKEN

    Network   PASS   data-plane 0.23 ms avg / 0.85 max / 0% loss · 10G uplink · H-offload all ports · 0 errors
    Tunnels   PASS   wireguard1 4s · hrb-router 2s · mulvad 1m29s · 4/4 pings 0% loss · kill-switch present
    Wifi      PASS   2 caps Run, 8 clients, channels 2412/5180/2462/5240 (all non-DFS)
    Internet  PASS   1.1.1.1 0% · pihole resolving · ISP 155.4.221.50 vs Mullvad 185.209.198.73
    Services  PASS   traefik 200 · argocd 200 · 6/8 nodes Ready · no failing pods

    Known-normal (not faults): node2/node3 down; garden cAP locked out; tappan-switch 6.49.19.
    ```

