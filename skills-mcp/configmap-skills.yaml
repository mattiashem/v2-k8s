      notify trigger AND `switch.*` to the arm list. ~6 of 12 door/gate sensors are `unavailable` (dead battery /
      comm failure on the Vera; they auto-arm when they recover). Raw Vera API: `http://192.168.1.23:3480/data_request?id=sdata`
      (item list), `&id=status&DeviceNum=<n>` (detail), `&id=action&DeviceNum=<n>&serviceId=urn:micasaverde-com:serviceId:SecuritySensor1&action=SetArmed&newArmedValue=1` (arm).
    - **Telegram:** `telegram_bot.send_message` with just `{"message":"..."}` (no chat_id — integration has a
      default chat). Emojis + Jinja templates in `message` are fine.

    Arming/disarming the alarm is user-facing and security-sensitive — confirm intent before toggling `input_boolean.larm`.

