    # network-ops — Home + Country-House MikroTik Network

    Operational runbook for the MikroTik network spanning the **home site**, the **country house (Tappan)**,
    and the **HRB WireGuard hub**. Use this when inspecting/changing routing, firewall, VPN, or firmware on the
    routers/switch. All devices are MikroTik. **The HRB cluster itself stays off-limits** (see project CLAUDE.md);
    the HRB *WireGuard hub* is separate infra at Hetzner — don't reconfigure it without explicit approval.

    > ⚠️ These are **live** devices. Back up first (`/system backup save name=...`). You manage Tappan-side
    > devices *through* the home router over WireGuard — rebooting the home router cuts the path to everything.

    ## Devices & access
    Logins are all user `admin`. **Passwords are stored in the project guide / memory, not here** —
    home router: see project `CLAUDE.md`; Tappan router & switch: see memory `project_tappan_router.md`.

    | Device | Model / OS | Mgmt IP | Reach from home LAN |
    |---|---|---|---|
    | **Home router** (`core-router`) | CCR1016-12S-1S+, **RouterOS 7.24.2** | `192.168.1.1` | direct (LAN) |
    | **Home switch** (`core-switch`) | CRS328-24P-4S+, **RouterOS 7.24.2** | `192.168.1.3` | direct (LAN) |
    | **CSS610 ×2** (`switch-uppe`/`switch-nere`) | CSS610-8G-2S+, **SwOS 2.21** | `192.168.1.7` / `.8` | **no SSH** — HTTP `/sys.b` |
    | **APs** (`wifi-attic`/`garage-door`) | hAP ac, **ROS 6.49.21** | `192.168.1.5` / `10.100.0.101` | direct / DMZ |
    | **Country-house router** (`tappan-router`) | RB3011UiAS, **RouterOS 7.23.1** | `192.168.10.1` | via `wireguard1` tunnel |
    | **Country-house switch** | CRS112-8G-4S, **RouterOS 6.49.19** | `192.168.10.2` | via tunnel + its gateway |
    | **HRB WG hub** | Hetzner WG server | `10.13.13.1` (`wireguard.robots.beer` / `65.21.254.116`) | — (off-limits) |

    SSH helper pattern (pull password from your store; disable host-key checks for these ephemeral sessions):
    ```bash
    # RT -> home router (admin@192.168.1.1), CH -> tappan (admin@192.168.10.1), SW -> switch (admin@192.168.10.2)
    RT='sshpass -p "$PW_HOME"   ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null admin@192.168.1.1'
    CH='sshpass -p "$PW_TAPPAN" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null admin@192.168.10.1'
    SW='sshpass -p "$PW_TAPPAN" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null admin@192.168.10.2'
    ```

