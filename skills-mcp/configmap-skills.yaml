    ## 3. Alarm + presence + notify

    - **Alarm:** `input_boolean.larm` = the house-alarm signal. **Auto-arm chain** (all after **30 min** empty):
      `automation.huset_tomt` (template: all 4 persons — mattias/lisa/olle/sam — not home, `for: 00:30:00`) → sets
      `input_boolean.empty` → `automation.larm_aktivera_vid_tomt_hus` (empty on → `larm` on + MQTT enables Frigate
      detect). Also `automation.1_aktivera_larm` (mattias/lisa away 30 min → `larm` on). Disarm on return:
      `automation.1_stanger_av_larm` (mattias/lisa home 10 min → `larm` off). `larm` on also →
      `automation.aktiverar_kameror` (cameras) + arms all Vera sensors (below).
    - **Frigate person alerts** — `automation.frigate_person_detekterad_larm` (MQTT `frigate-{inomhus,utomhus}/events`
      → Telegram + snapshot). **Gates (retuned 2026-07-14 after over-tightening gave ZERO alerts):** type=new &
      label=person, camera in allowlist [door,doorbell,garage,altan,portal,tomten] (framsidan+baksidan muted; **tak
      person-detection disabled 2026-07-16** via `detect.enabled=false` in git + removed from detect-sync & allowlist — roof cam, all false positives; recording still on),
      `after.score >= 0.5` (was 0.7 — too strict: on a `new` event the initial score is low and climbs, so 0.7
      blocked ~everything), `input_boolean.larm` on **OR camera == doorbell** (doorbell = sole always-alert entrance even when
      home), per-camera 5-min cooldown (JSON map `input_text.frigate_alert_cooldown`, marked before send).
      **Diagnosis tip:** real person `top_score` on these cams tops out ~0.70–0.84 — never gate above that. Check
      `GET frigate-*:5000/api/events?label=person` for actual scores. Source-level: `objects.filters.person`
      **threshold 0.7 / min_score 0.5** (was 0.8/0.6 — killed detection), **doorbell per-camera override threshold 0.75 / min_score 0.6**
      (raised from 0.6 on 2026-07-16 to cut false alarms; real person top_score ~0.70–0.84). tak: `detect.enabled=false`.
      NB: object thresholds are NOT MQTT-toggleable → a threshold change needs a Frigate **restart** (self-heal re-enables detect after)
      (GitOps `home/frigate-{inomhus,utomhus}.yaml`, DEPLOYED 2026-07-14 commit 6cf05f9; earlier 0.8 was commit 0caaf3f).
      Deploy = scoped ArgoCD sync of the 2 ConfigMaps + `rollout restart` both StatefulSets; verified live via `/api/config`.
      `home` app is manual-sync
      + broadly OutOfSync, so use the scoped-sync recipe (see [[project_pihole_ha]]), never a blanket `argocd app sync home`.
      Cameras: cluster Frigate at `frigate-inomhus.v2.local` / `frigate-utomhus.v2.local` (ns `frigate`, svc :5000).
      (Jetson no longer runs Frigate — it only runs Ollama gemma4b.)
    - **⚠️ Detection is GATED, not always-on** — the #1 "no alerts at all" cause. Frigate object detection per camera
      is toggled via MQTT `frigate-{inst}/{cam}/detect/set` ON/OFF. `automation.frigate_detect_sync` (built 2026-07-16)
      owns it: **doorbell = ALWAYS ON** (sole entrance, alerts even when home; `door` cam is offline so it moved to the
      gated group 2026-07-16), the other cams follow `input_boolean.empty`
      (ON when house empty, OFF when occupied). **Self-heals** on `frigate-*/available`=online, HA start, and every 30 min —
      because a Frigate **restart resets detect to OFF** and the old `larm_aktivera_vid_tomt_hus` only re-sent ON on an
      `empty` *transition*, so restarting Frigate while already-empty left detection dead (silent, no alerts). If alerts
      vanish: FIRST check `mosquitto_sub -t 'frigate-+/+/detect/state'` — if OFF, detection isn't running (thresholds are
      irrelevant). `larm_aktivera_vid_tomt_hus` now only bridges empty→`larm` (detect stripped out). Also note: the `door`
      camera stream (`rtsp://10.100.0.25:554`) is offline (network) so it won't detect regardless.
    - **📷 Camera settings table & how to update** (full detail: memory `project_frigate_cameras`). Global person
      filter both instances: **min_score 0.5 / threshold 0.7**. Per-camera:

      | Camera (instance) | Threshold | Detect | Alerts |
      |---|---|---|---|
      | doorbell (utomhus) | **0.75** / min_score 0.6 | ALWAYS ON | **always** (even unarmed) |
      | tak (utomhus) | — | **OFF** (`detect.enabled=false`) | off |
      | door (inomhus) | 0.7 | gated | armed-only — **OFFLINE** |
      | altan, portal, tomten (utomhus) | 0.7 | gated | armed-only |
      | garage (inomhus) | 0.7 | gated | armed-only |
      | baksidan, framsidan (inomhus) | 0.7 | gated | **muted** |

      **3 layers to change things:** (1) **quality/enable** = Frigate config `home/frigate-{inst}.yaml`
      (`objects.filters.person.{min_score,threshold}` global or `cameras.<cam>.objects.filters.person.*`; disable a cam
      with `cameras.<cam>.detect.enabled: false`) → **commit+push → scoped ArgoCD sync of the ConfigMap → `kubectl rollout
      restart statefulset/frigate-<inst> -n frigate`** (thresholds are NOT MQTT-hot-reloadable; restart safe via self-heal);
      verify `GET frigate-<inst>:5000/api/config`. (2) **detect on/off & always-on-vs-gated** = `automation.frigate_detect_sync`.
      (3) **allowlist / always-alert / score / cooldown** = `automation.frigate_person_detekterad_larm` (id 1782818566234).
      Rule of thumb: real person `top_score` ~0.70–0.84 → never set threshold above ~0.8.
    - **🛰️ Reolink V2Box hub — scene mode follows the alarm** (added 2026-09-02). The hub
      (`9527000MXLFM1WIJ`, cameras `tak`/`baksidan`/`front_door`/`inne`) has its own arming concept,
      **`select.v2box_scene_mode`** with options `off` / `disarm` / **`home`** / **`away`**. This is a
      **separate system from Frigate** — Frigate pulls RTSP straight off each camera and runs its own
      detection; the scene mode only governs the *hub's* detection, push notifications and siren. Until
      2026-09-02 it sat on `home` permanently and ignored the alarm.
      `automation.larm_reolink_scenlage` (id `larm_reolink_scenlage`) now maps **`larm` on → `away`,
      `larm` off → `home`**. **Self-healing, deliberately not edge-triggered**: the hub drops to
      `unavailable` and back ~once a day when it reconnects (seen 2026-09-01 06:25, 2026-09-02 07:16),
      so it re-evaluates on larm change + HA start + `/15 min` + `select` back `from: unavailable`,
      skips when the entity is `unavailable`/`unknown`, writes only when the mode is actually wrong,
      retries 3× (15 s apart) and raises a **latched** Telegram warning via
      `input_boolean.reolink_scenlage_fel`. Canonical copy in git: `home/reolink/`.
    - **Vera Z-Wave sensors** (native `vera` integration, config entry → `http://192.168.1.23:3480`, serial
      50102184). Each armable security/motion/door sensor = a pair with SYMMETRIC names: **`switch.<name>` = arm
      on/off**, **`binary_sensor.<name>` = motion/tripped** (e.g. `switch.garaget_525` / `binary_sensor.garaget_525`).
      Two composed automations: `automation.vera_armera_sensorer_med_larm` (**`input_boolean.larm` on → arm all 12
      `switch.*`, off → disarm all**; continue_on_error) + `automation.vera_rorelse_notis_armerade_sensorer`
      (id `vera_rorelse_notis`: any listed motion → on, condition
      `{{ is_state(trigger.entity_id | replace('binary_sensor.','switch.'),'on') }}` = armed only → Telegram).
