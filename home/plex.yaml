apiVersion: v1
kind: Namespace
metadata:
  name: plex
  labels:
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  namespace: plex
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
  namespace: plex
spec:
  selector:
    matchLabels:
      app: plex
  serviceName: plex
  replicas: 1
  template:
    metadata:
      labels:
        app: plex
    spec:
      # Only big amd64 box left (40 cores / 128 GB). Pinning also stops the
      # Longhorn multi-attach shuffle when the pod gets rescheduled.
      nodeSelector:
        kubernetes.io/hostname: node1
      containers:
      - name: plex
        image: plexinc/pms-docker:latest
        imagePullPolicy: Always
        env:
        - name: TZ
          value: Europe/Stockholm
        # Seed values for a fresh /config only. The live prefs on the PVC win;
        # change them via PUT /:/prefs (customConnections / LanNetworksBandwidth).
        - name: ADVERTISE_IP
          value: http://192.168.1.41:32400/
        - name: ALLOWED_NETWORKS
          value: 192.168.1.0/24,10.0.0.0/24,10.244.0.0/16,192.168.10.0/24
        ports:
        - containerPort: 32400
          name: http
        - containerPort: 3005
        - containerPort: 3324
        - containerPort: 32469
        - containerPort: 1900
          protocol: UDP
        - containerPort: 32410
          protocol: UDP
        - containerPort: 32412
          protocol: UDP
        - containerPort: 32413
          protocol: UDP
        - containerPort: 32414
          protocol: UDP
        # No CPU limit: transcodes should burst across node1's cores.
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 8Gi
        # Generous startup window for DB migrations after a :latest upgrade.
        startupProbe:
          httpGet:
            path: /identity
            port: 32400
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /identity
            port: 32400
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /identity
            port: 32400
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - mountPath: /data
          name: nfs-vol
        - mountPath: /config/
          name: config
        - name: transcode
          mountPath: /transcode
      volumes:
      - name: nfs-vol
        nfs:
          server: 10.0.0.10
          path: /mnt/disk/media/
      - name: config
        persistentVolumeClaim:
          claimName: plex-config
      # RAM-backed transcode scratch (counts against the 8Gi memory limit).
      - name: transcode
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: plex
  annotations:  
    external-dns.alpha.kubernetes.io/hostname: plex.v2.local
    metallb.universe.tf/address-pool: lan
spec:
  ports:
  - name: http
    port: 32400
    protocol: TCP
  - name: http2
    port: 3005
    protocol: TCP
  - name: port1
    port: 3324
    protocol: TCP
  - name: sync
    port: 32469
    protocol: TCP
  - name: stream0
    port: 1900
    protocol: UDP
  - name: stream1
    port: 32410
    protocol: UDP
  - name: stream2
    port: 32412
    protocol: UDP
  - name: stream3
    port: 32413
    protocol: UDP
  - name: stream4
    port: 32414
    protocol: UDP
  selector:
    app: plex
  type: LoadBalancer
---


