apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-etc
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-dnsmasq
  namespace: home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
      number: "1"
  template:
    metadata:
      labels:
        app: pihole
        number: "1"
    spec:
      containers:
        # orbital-sync removed: v1 only speaks the Pi-hole v5 /admin login API,
        # which is gone in Pi-hole v6 (returns 404). Replaced by the standalone
        # nebula-sync Deployment below, which uses the v6 Teleporter API.
        - name: pihole
          # https://hub.docker.com/r/pihole/pihole/tags
          image: pihole/pihole:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "Europe/Stockholm"
            - name: FTLCONF_webserver_api_password
              value: "v2password"
            # ALL (not LOCAL): queries arrive via the LoadBalancer VIP from
            # non-pod-local sources (and SNAT'd node IPs under Cluster policy),
            # so LOCAL mode silently drops every LAN query. Required for the
            # round-robin VIP to actually answer 192.168.1.0/24 clients.
            - name: FTLCONF_dns_listeningMode
              value: "ALL"
            # Public upstreams. These were ["10.0.0.1","192.168.1.1"] = the router,
            # whose own /ip dns upstream is this very Pi-hole VIP -> a resolver loop
            # that only the router's 1.1.1.1 second server kept afloat. Local names
            # are handled by revServers below, so the upstreams can be public.
            - name: FTLCONF_dns_upstreams
              value: "1.1.1.1;9.9.9.9"
            # Conditional forwarding. Per entry: <enabled>,<cidr>,<server>,<domain>
            # (";" separates array elements in FTLCONF_* env vars, "," separates the
            # fields inside one entry). This does two jobs: it forwards the local
            # domains to the MikroTik that owns them, and it sends in-addr.arpa PTR
            # lookups for each range to the router -- which is how client names can
            # reach the dashboard once clients query Pi-hole directly.
            - name: FTLCONF_dns_revServers
              value: "true,192.168.1.0/24,192.168.1.1,v2.local;true,192.168.44.0/24,192.168.1.1,v2.ollebo.com;true,10.0.0.0/24,10.0.0.1,iot.v2.local;true,10.100.0.0/24,10.100.0.1,dmz.v2.local"
          #securityContext:
          #  privileged: true
          ports:
            - containerPort: 53
              protocol: TCP
            - containerPort: 53
              protocol: UDP
            - containerPort: 67
              protocol: UDP
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: etc
              mountPath: /etc/pihole
            - name: dnsmasq
              mountPath: /etc/dnsmasq.d
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 1
      nodeSelector:
        pihole: "1"
      volumes:
        - name: etc
          persistentVolumeClaim:
            claimName: pihole-etc
        - name: dnsmasq
          persistentVolumeClaim:
            claimName: pihole-dnsmasq
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/address-pool: pihole-lan-secondary
    external-dns.alpha.kubernetes.io/hostname: pihole.v2.local
  labels:
    app: pihole
  name: pihole-lan2
  namespace: home
spec:
  ports:
  - name: dns
    port: 53
    protocol: TCP
    targetPort: 53
  - name: dnsudp
    port: 53
    protocol: UDP
    targetPort: 53
  # Second LAN resolver VIP (192.168.1.19), announced from talos-wyx-ktb via the
  # MetalLB "pihole-lan-secondary" pool (nodeSelectors {pihole: "2"}). Handed to
  # clients as the second DHCP DNS server, so a dead primary pod costs a retry,
  # not DNS. NB: the similarly-named "pihole-lan2" pool is NOT this -- it holds
  # 192.168.1.16, which belongs to traefik/traefik.
  # externalTrafficPolicy: Local for the same reason as pihole-lan -- real client
  # source IPs. internalTrafficPolicy stays Cluster so in-cluster callers are not
  # pinned to a node that happens to have no pod.
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Local
  selector:
    app: pihole
    number: "2"
  #sessionAffinity: None
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/address-pool: pihole-lan
    #metallb.io/loadBalancerIPs: 192.168.1.17
  labels:
    app: pihole
  name: pihole-lan
  namespace: home
spec:
  ports:
  - name: dns
    port: 53
    protocol: TCP
    targetPort: 53
  - name: dnsudp
    port: 53
    protocol: UDP
    targetPort: 53
  # Primary LAN resolver VIP (192.168.1.17), handed to LAN + Guest clients by
  # the MikroTik DHCP server.
  #
  # externalTrafficPolicy: Local -- REQUIRED for per-client visibility. Under
  # Cluster policy kube-proxy SNATs, so every query reached FTL as the node
  # address (10.244.1.1 held 13k queries and was the *only* client Pi-hole had
  # ever seen). Local skips the SNAT and FTL logs the real 192.168.1.x source.
  #
  # This costs nothing in availability: the MetalLB "pihole-lan" pool already
  # carries nodeSelectors {pihole: "1"}, so .17 is announced from turing1 alone
  # either way -- it was never a two-node VIP. Redundancy lives at the client
  # instead: DHCP also hands out .19 (pihole-lan2 Service, on talos-wyx-ktb).
  selector:
    app: pihole
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Local
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/address-pool: pihole
  labels:
    app: pihole
  name: pihole-dmz
  namespace: home
spec:
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ports:
  - name: dns
    port: 53
    protocol: TCP
    targetPort: 53
  - name: dnsudp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: pihole
    number: "1"
  sessionAffinity: None
  type: LoadBalancer

---
