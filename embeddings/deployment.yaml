apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embed
  namespace: embeddings
  labels:
    app: ollama-embed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-embed
  template:
    metadata:
      labels:
        app: ollama-embed
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          # node1 sits at its pod cap and hosts both openclaw instances.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["node1"]
          # Prefer the big amd64 boxes; they flap, so this is a preference, and the
          # emptyDir model store lets the pod come back on any other node.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["node2", "node3"]
      # The model is pulled into an emptyDir instead of a Longhorn PVC: ~600 MB is
      # quick to fetch, and the pod is not tied to a volume on a node that may be gone.
      initContainers:
        - name: pull-model
          image: ollama/ollama:0.34.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve & pid=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull "$EMBED_MODEL"
              kill $pid
          env:
            - name: EMBED_MODEL
              value: embeddinggemma:300m
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /models
            - name: HOME
              value: /tmp
          securityContext: &sc
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts: &mounts
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ollama
          image: ollama/ollama:0.34.1
          args: ["serve"]
          env:
            - name: EMBED_MODEL
              value: embeddinggemma:300m
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /models
            - name: HOME
              value: /tmp
            # Keep the model resident: a cold load costs seconds on every memory lookup.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 3Gi
          securityContext: *sc
          volumeMounts: *mounts
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir: {}
