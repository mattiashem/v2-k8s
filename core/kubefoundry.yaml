# kube-foundry — Kubernetes-native AI software engineering factory.
# https://kube-foundry.io  |  https://github.com/kube-foundry/kube-foundry
#
# Operator + webhook server watch SoftwareTask CRs, spawn a sandbox pod running
# an AI coding agent (Claude Code / Codex / OpenCode), and the agent opens a PR.
#
# Chart lives in an OCI registry, not a classic Helm repo, so it needs a
# repository entry with enableOCI. Registry is public — no credentials.
---
apiVersion: v1
kind: Secret
metadata:
  name: kube-foundry-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: kube-foundry
  type: helm
  url: ghcr.io/kube-foundry/kube-foundry
  enableOCI: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubefoundry
  namespace: argocd
spec:
  project: core
  source:
    chart: kube-foundry
    repoURL: ghcr.io/kube-foundry/kube-foundry
    targetRevision: 0.1.0
    helm:
      releaseName: kube-foundry
      values: |
        # The chart stamps this into every rendered object's metadata.namespace,
        # so it must match spec.destination.namespace below or the sync splits
        # resources across two namespaces.
        namespace: kubefoundry

        # Upstream's agent-open-code:v0.1.0 ships the entrypoint but NOT the
        # opencode binary, so every `agent: open-code` task died at step 4/6
        # with "opencode: command not found" (exit 127). Everything else in
        # that image is fine, so elino-apps/cloudbilder builds a thin layer
        # over it that installs a pinned opencode release.
        #
        # open-code is the agent we need: it is the only one that can be
        # pointed at an OpenAI-compatible endpoint (berget.ai) through its
        # config.json provider block — see kubefoundry/skill-berget-opencode.yaml.
        # claude-code speaks the Anthropic Messages API, which berget does not
        # serve (POST /v1/messages -> 404), and agent-codex:v0.1.0 is broken a
        # different way (ships codex-cli 0.117.0 but its entrypoint calls
        # --approval-mode, removed in that version).
        #
        # amd64 only — the upstream base image is published for that platform
        # alone, so sandbox pods must schedule onto an amd64 node.
        #
        # Revert to the upstream repository if a later release ships a working
        # image; check `command -v opencode` in it before assuming it is fixed.
        agent:
          openCode:
            image:
              repository: ghcr.io/elino-apps/cloudbilder/agent-open-code
              tag: v0.1.0

        # The chart's NetworkPolicy is unusable here on two counts:
        #   1. The `core` AppProject namespaceResourceBlacklist denies
        #      NetworkPolicy, so ArgoCD would refuse to sync it anyway.
        #   2. Its allowedEgress is a hardcoded CIDR list (GitHub + a Cloudflare
        #      range fronting the Anthropic API) with no DNS rule at all, so
        #      sandboxes could not even resolve github.com.
        networkPolicy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kubefoundry
  syncPolicy:
    # Manual sync, matching the other core infra apps. Sandbox pods burn real
    # API credits, so this stays a deliberate press-the-button deploy.
    syncOptions:
      - CreateNamespace=true
      # Makes ignoreDifferences authoritative during sync, not just during diff.
      # Without it the chart would happily overwrite the CRD schema again.
      # Same pattern core/metallb.yaml already uses for its webhook caBundles.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # The chart's packaged SoftwareTask CRD is stale relative to the v0.1.0
    # operator it ships with — no `skills`, no `mcpServers`, and an agent enum
    # of just [claude-code]. kubefoundry/crd-softwaretask.yaml carries upstream's
    # own generated CRD for the same tag instead; this hands the schema over to
    # it so a chart sync cannot stomp it back to the broken version.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: softwaretasks.factory.factory.io
      jsonPointers:
        - /spec/versions
---
# CRD corrections + Skills that the Helm chart fails to ship. Split into its own
# Application (rather than inlined here) because the two CRDs are ~1000 lines of
# generated schema, and because they must be able to sync independently of the
# chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubefoundry-config
  namespace: argocd
spec:
  project: core
  source:
    repoURL: git@github.com:mattiashem/v2-k8s.git
    targetRevision: HEAD
    path: kubefoundry
  destination:
    server: https://kubernetes.default.svc
    namespace: kubefoundry
  syncPolicy:
    # Manual, like the chart app. Deliberate: syncing this changes the schema
    # the operator validates tasks against.
    syncOptions:
      - CreateNamespace=true
      # The generated CRDs exceed the 262144-byte annotation limit that a
      # client-side apply would need for last-applied-configuration.
      - ServerSideApply=true
