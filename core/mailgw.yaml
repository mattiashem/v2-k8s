# Elino mail suite on v2cluster, namespace `mailgw`.
#
# Manifests are not authored here. Each repo's "Deploy To Production" workflow
# renders its own chart with chart/values-v2cluster.yaml and commits the result
# to elino-apps/k8-cluster-elino under clusters/v2cluster/<service>/. These
# Applications only point at those paths, so a merge to main is what moves the
# cluster — see CLAUDE.md in the mail-system working root.
#
# clusters/v2cluster/ is deliberately a different path from manifest/. The
# latter is the production render and is on its own release cadence; pointing
# both at one path is how a dev cluster ends up running production values.
#
# The repository credential is NOT in this file. k8-cluster-elino is private
# and this repo is public, so the deploy key lives only in the cluster as
# secret `repo-k8-cluster-elino` in the argocd namespace:
#
#   kubectl create secret generic repo-k8-cluster-elino -n argocd \
#     --from-literal=type=git \
#     --from-literal=url=git@github.com:elino-apps/k8-cluster-elino.git \
#     --from-file=sshPrivateKey=<key> \
#     && kubectl label secret repo-k8-cluster-elino -n argocd \
#          argocd.argoproj.io/secret-type=repository
#
# Secrets in the namespace are hand-managed and out of git. Every chart renders
# no Secret when its secrets.* values are blank, and values-v2cluster.yaml
# leaves them blank on purpose. edge-postfix-role, edge-postfix-db,
# mail-client-secret and mail-store-owner already exist and must keep existing.
#
# No Application here prunes. The namespace holds two CNPG clusters and the
# MinIO volume that is the archive's system of record; a bad render must be
# able to be wrong without being destructive.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailgw-edge-postfix
  namespace: argocd
  annotations:
    # Edge first. postfix-client's internal Postfix reads the configuration
    # database this chart creates, and its relayhost points at edge's service.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: core
  source:
    repoURL: git@github.com:elino-apps/k8-cluster-elino.git
    targetRevision: HEAD
    path: clusters/v2cluster/edge-postfix
  destination:
    server: https://kubernetes.default.svc
    namespace: mailgw
  # Cluster/mail-config-pg diffar permanent utan att något är fel: CNPG:s
  # operator fyller i defaultvärden som charten inte skriver ut, och de syns
  # som drift. Fälten nollas på båda sidor innan diffen i stället för att
  # skrivas in i charten, för en default som upprepas i git driftar tyst den
  # dagen operatorn ändrar den.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      name: mail-config-pg
      jsonPointers:
        - /spec/affinity/podAntiAffinityType
        - /spec/affinity/topologyKey
        - /spec/storage/resizeInUseVolumes
        - /spec/bootstrap/initdb/encoding
        - /spec/bootstrap/initdb/localeCType
        - /spec/bootstrap/initdb/localeCollate
        # En enda roll, därav indexet. Operatorn sätter connectionLimit och
        # släpper createdb/createrole när de är false.
        - /spec/managed/roles/0/connectionLimit
        - /spec/managed/roles/0/createdb
        - /spec/managed/roles/0/createrole
  syncPolicy:
    automated:
      # Se den gemensamma kommentaren överst: ingen Application här prunar.
      prune: false
      # Till skillnad från de andra två: selfHeal av. Resurserna installerades
      # för hand med Helm 2026-08-01 och bär verklig state, och en databas ska
      # inte återställas i en loop om diffen mot förmodan inte är ren. Nya
      # revisioner i git rullas ut ändå — selfHeal styr bara om ArgoCD jagar
      # avvikelser i klustret när git står stilla.
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailgw-postfix-client
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: core
  source:
    repoURL: git@github.com:elino-apps/k8-cluster-elino.git
    targetRevision: HEAD
    path: clusters/v2cluster/postfix-client
  destination:
    server: https://kubernetes.default.svc
    namespace: mailgw
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailgw-mail-client
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: core
  source:
    repoURL: git@github.com:elino-apps/k8-cluster-elino.git
    targetRevision: HEAD
    path: clusters/v2cluster/mail-client
  destination:
    server: https://kubernetes.default.svc
    namespace: mailgw
  syncPolicy:
    # Båda villkoren som höll den här manuell är uppfyllda sedan 2026-09-16.
    # `mail-client-web-secret` finns i namnrymden, och routen är beslutad och
    # utlagd: mail.v2.local, entrypoint web utan TLS eftersom ett internt namn
    # aldrig klarar HTTP-01. Klienten nås alltså utan port-forward.
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
