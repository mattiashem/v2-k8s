apiVersion: v1
kind: Service
metadata:
  name: irc-relay
  namespace: irc-relay
  labels:
    app: irc-relay
spec:
  type: ClusterIP
  selector:
    app: irc-relay
  ports:
    - name: http
      port: 80
      targetPort: http
---
# LAN clients (Claude Code on the workstation) reach the relay here.
# In-cluster clients must use http://irc-relay.irc-relay.svc.cluster.local
# instead - *.v2.local does not resolve inside pods, it is a pihole-only zone.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: irc-relay
  namespace: irc-relay
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: irc-relay.v2.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: irc-relay
                port:
                  number: 80
